[package]
name = "voice-text-board"
version = "0.1.0"
description = "Offline classroom voice and text board"
authors = ["Voice Text Board"]
edition = "2021"

[lib]
name = "voice_text_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
